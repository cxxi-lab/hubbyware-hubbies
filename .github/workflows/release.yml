name: release

# Each hubby released on its own (cxxi-lab/hubbyware-ui's reusable workflow): its version bumped from the
# commits touching its folder since its last tag (<id>-v<version>), built, signed, uploaded. One at a
# time: each pushes its version commit and tag. A hubby none of whose commits says feat/fix/BREAKING
# releases nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        hubby: [ai, business, mail, planner, sample, workout]
    uses: cxxi-lab/hubbyware-ui/.github/workflows/hubby-release.yml@main
    with:
      path: ${{ matrix.hubby }}
      tag-prefix: ${{ matrix.hubby }}-v
    secrets: inherit
