name: release

# Each module released on its own (cxxi-lab/hub-ui's reusable workflow): its version bumped from the
# commits touching its folder since its last tag (<id>-v<version>), built, signed, uploaded. One at a
# time: each pushes its version commit and tag. A module none of whose commits says feat/fix/BREAKING
# releases nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        module: [ai, business, mail, planner, sample, workout]
    uses: cxxi-lab/hub-ui/.github/workflows/module-release.yml@main
    with:
      path: ${{ matrix.module }}
      tag-prefix: ${{ matrix.module }}-v
    secrets: inherit
